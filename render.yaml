services:
  - type: web
    name: turf-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: turf-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: turf-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: turf-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: turf-db
          property: database
      - key: SESSION_SECRET
        value: change-me-in-render-dashboard

  - type: web
    name: turf-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - path: /*
        destination: /index.html

databases:
  - name: turf-db
    databaseName: turfdb
    user: turfuser
